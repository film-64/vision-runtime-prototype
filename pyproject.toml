[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-runtime-prototype"
version = "0.1.0"
description = "Curated runtime-control prototype extracted from a larger visual-perception system"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "film-64" }]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["vision_runtime*", "dynamic_pipeline*", "roi_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
