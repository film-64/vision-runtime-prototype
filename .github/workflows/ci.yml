name: runtime-core-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install build and test tools
        run: python -m pip install --upgrade pip build pytest
      - name: Build package
        run: python -m build
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Run model-free contract tests
        run: pytest -q
      - name: Run control-core demo
        run: python examples/runtime_control_demo.py
      - name: Run Observation contract demo
        run: python examples/observation_contract_demo.py
