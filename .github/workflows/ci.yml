name: runtime-core-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install build and test tools
        run: python -m pip install --upgrade pip build pytest
      - name: Build package
        run: python -m build
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Run model-free contract tests
        run: pytest -q
      - name: Run control-core demo
        run: python examples/runtime_control_demo.py
      - name: Run Observation contract demo
        run: python examples/observation_contract_demo.py
      - name: Generate current synthetic metadata E2E evidence
        run: python scripts/generate_public_evidence.py
      - name: Confirm existing package verifier result
        run: |
          python -c 'import json, pathlib; p=json.loads(pathlib.Path("docs/evidence/current-synthetic-metadata-e2e/verify-result.json").read_text()); assert p["ok"] is True and not p["errors"] and not p["warnings"]'
      - name: Confirm ReplayRuntime verification result
        run: |
          python -c 'import json, pathlib; p=json.loads(pathlib.Path("docs/evidence/current-synthetic-metadata-e2e/replay-summary.json").read_text()); assert p["loaded"] is True and p["frame_count"] == 3 and p["object_count"] == 4'
      - name: Run synthetic metadata E2E pytest
        run: pytest -q tests/test_generate_public_evidence.py
      - name: Upload current synthetic metadata E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-synthetic-metadata-e2e-${{ github.sha }}
          path: docs/evidence/current-synthetic-metadata-e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
